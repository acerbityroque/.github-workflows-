name: Evolução de Nível Anual

on:
  schedule:
    # Executa à 00:00 (UTC) no dia 9 do mês 7 (Julho)
    - cron: '0 0 9 7 *'
  workflow_dispatch: # Permite que você rode manualmente clicando em um botão no GitHub

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar script de evolução
        run: node update-age.js

      - name: Commitar e salvar novo nível
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "✨ feat: evolução de nível! Atualiza idade no README" || echo "Nenhuma alteração a ser feita"
          git push